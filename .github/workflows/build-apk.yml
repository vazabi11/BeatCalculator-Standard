name: Build Calculator APK

on:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish a public testing pre-release (debug APK)
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      apk_sha256: ${{ steps.package.outputs.apk_sha256 }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools are missing"
            exit 1
          fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Unit test calculator engine
        shell: bash
        run: |
          mkdir -p tests/out
          javac -encoding UTF-8 -d tests/out \
            app/src/main/java/com/beatoflove/standardcalculator/CalculatorEngine.java \
            app/src/main/java/com/beatoflove/standardcalculator/UnitConverter.java \
            tests/CalculatorEngineTest.java \
            tests/AdvancedFeaturesTest.java \
            app/src/main/java/com/beatoflove/standardcalculator/CacheUpdatePolicy.java \
            tests/CacheUpdatePolicyTest.java \
            app/src/main/java/com/beatoflove/standardcalculator/FreshnessPolicy.java \
            app/src/main/java/com/beatoflove/standardcalculator/OilPriceParser.java \
            tests/MarketFeedsTest.java \
            app/src/main/java/com/beatoflove/standardcalculator/MarketTime.java \
            tests/MarketTimeTest.java \
            tests/PttParserDiagnosticsTest.java \
            app/src/main/java/com/beatoflove/standardcalculator/FormulaEngine.java \
            app/src/main/java/com/beatoflove/standardcalculator/FormulaStats.java \
            tests/FormulaProTest.java \
            app/src/main/java/com/beatoflove/standardcalculator/FinancialMath.java \
            tests/FinancialMathTest.java \
            app/src/main/java/com/beatoflove/standardcalculator/PttOilService.java \
            app/src/main/java/com/beatoflove/standardcalculator/ProvinceNames.java \
            tests/RegionalFuelTest.java \
            app/src/main/java/com/beatoflove/standardcalculator/UiPolicy.java \
            tests/UiPolicyTest.java \
            app/src/main/java/com/beatoflove/standardcalculator/ReferenceRate.java \
            tests/ReferenceRateTest.java
          java -cp tests/out com.beatoflove.standardcalculator.CalculatorEngineTest
          java -cp tests/out com.beatoflove.standardcalculator.AdvancedFeaturesTest
          java -cp tests/out com.beatoflove.standardcalculator.MarketFeedsTest
          java -cp tests/out com.beatoflove.standardcalculator.CacheUpdatePolicyTest
          java -cp tests/out com.beatoflove.standardcalculator.PttParserDiagnosticsTest
          java -cp tests/out com.beatoflove.standardcalculator.MarketTimeTest
          java -cp tests/out com.beatoflove.standardcalculator.FormulaProTest
          java -cp tests/out com.beatoflove.standardcalculator.FinancialMathTest
          java -cp tests/out com.beatoflove.standardcalculator.RegionalFuelTest
          java -cp tests/out com.beatoflove.standardcalculator.UiPolicyTest
          java -cp tests/out com.beatoflove.standardcalculator.ReferenceRateTest

      - name: Check scoped UI requirements
        run: python3 tests/ui_v535_source_check.py

      - name: Check unified calculator actions
        run: python3 tests/ui_v536_source_check.py

      - name: Build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK version and prepare named artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib
          import os
          import re
          import shutil
          import subprocess
          from pathlib import Path

          gradle = Path('app/build.gradle').read_text(encoding='utf-8')
          def exactly_one(pattern, text, label):
              matches = re.findall(pattern, text, re.MULTILINE)
              if len(matches) != 1:
                  raise SystemExit(f'Cannot verify {label}: expected one value, got {len(matches)}')
              return matches[0]

          expected_version = exactly_one(r"^\s*versionName\s+['\"]([^'\"]+)['\"]\s*$", gradle, 'Gradle versionName')
          expected_code = exactly_one(r"^\s*versionCode\s+(\d+)\s*$", gradle, 'Gradle versionCode')
          expected_id = exactly_one(r"^\s*applicationId\s+['\"]([^'\"]+)['\"]\s*$", gradle, 'Gradle applicationId')
          apk = Path('app/build/outputs/apk/debug/app-debug.apk')
          aapt = Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0/aapt'
          apksigner = aapt.parent / "apksigner"
          subprocess.run([str(apksigner), "verify", "--verbose", "--print-certs", str(apk)], check=True)
          badging = subprocess.check_output([str(aapt), 'dump', 'badging', str(apk)], text=True)
          package = exactly_one(r'^package: (.+)$', badging, 'APK package metadata')
          def apk_field(name):
              return exactly_one(r"(?:^|\s)" + name + r"='([^']+)'", package, 'APK ' + name)
          version, code, app_id = apk_field('versionName'), apk_field('versionCode'), apk_field('name')
          if (version, code, app_id) != (expected_version, expected_code, expected_id):
              raise SystemExit(f'APK metadata mismatch: actual {(version, code, app_id)}; expected {(expected_version, expected_code, expected_id)}')
          if not re.fullmatch(r'[0-9]+(?:\.[0-9]+){2}(?:[-+][A-Za-z0-9._-]+)?', version):
              raise SystemExit('Unsupported versionName for a safe artifact name: ' + version)
          if not re.search(r'^application-debuggable\s*$', badging, re.MULTILINE):
              raise SystemExit('Expected a debuggable APK from assembleDebug')

          name = 'Calculator-v' + version
          dest = Path('dist') / (name + '.apk')
          dest.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(apk, dest)
          checksum = hashlib.sha256(dest.read_bytes()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'artifact_name={name}\napk_path={dest.as_posix()}\napk_sha256={checksum}\n')
          summary = (
              '## Calculator APK — verified metadata\n'
              f'- File: `{dest.name}`\n'
              f'- Version: `{version}` (code `{code}`)\n'
              f'- Application ID: `{app_id}`\n'
              '- Build type: **Debug / testing only**\n'
              f'- Commit: `{os.environ.get("GITHUB_SHA", "unknown")}`\n'
              f'- SHA-256: `{checksum}`\n'
          )
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write(summary)
          print(summary)
          PYCODE

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.apk_path }}
          if-no-files-found: error

  publish:
    name: Publish testing pre-release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_prerelease && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: calculator-publish-${{ needs.build.outputs.artifact_name }}
      cancel-in-progress: false
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Publish pre-release without replacing existing versions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          EXPECTED_SHA: ${{ needs.build.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_NAME" =~ ^Calculator-v[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9._-]+)?$ ]]
          APK="dist/${ARTIFACT_NAME}.apk"
          TAG="v${ARTIFACT_NAME#Calculator-v}"
          printf '%s  %s\n' "$EXPECTED_SHA" "$APK" | sha256sum --check
          # Do not retag or overwrite an already published version.
          if gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --silent; then
            echo "::error::Tag already exists; increment versionName and versionCode before publishing."
            exit 1
          fi
          gh release create "$TAG" "$APK" --repo "$GH_REPO" \
            --target "$GITHUB_SHA" --title "$ARTIFACT_NAME" --prerelease \
            --notes "Debug APK for testing only. Build and unit tests passed; live APIs and device acceptance are not certified. Commit: $GITHUB_SHA. SHA-256: $EXPECTED_SHA"
