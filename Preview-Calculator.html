<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#202020"><title>Calculator — Beat of Love</title>
<style>
:root{color-scheme:dark;--bg:#202020;--panel:#313331;--digit:#393c39;--blue:#4cc2ff;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;background:#101210;color:var(--white);font-family:Segoe UI,"Noto Sans Thai",Arial,sans-serif;overflow:hidden}body{display:flex;align-items:center;justify-content:center;min-height:100dvh}button{font-family:inherit;color:inherit;cursor:pointer;border:0}button:focus-visible{outline:2px solid #4cc2ff;outline-offset:-2px}.calculator{display:flex;flex-direction:column;background:var(--bg);width:min(100vw,536px);height:min(100dvh,803px);min-height:500px;overflow:hidden;position:relative;border:1px solid #343434;border-radius:8px;box-shadow:0 16px 40px #0008}.window-bar{height:46px;display:flex;align-items:center;flex-shrink:0;background:#1e1e1e;padding:0 4px 0 16px;gap:12px;font-size:16px}.app-symbol{font-size:21px;color:var(--blue);width:23px}.app-label{flex:1}.window-controls{display:flex;height:100%}.window-controls button{background:transparent;width:62px;font-size:20px}.window-controls button:hover{background:#383838}.window-controls .close:hover{background:#b72025}.mode-bar{height:70px;display:flex;align-items:center;gap:14px;flex-shrink:0;padding:0 14px}.menu-button{font-size:25px;background:transparent;line-height:1;width:30px;padding:0}.standard{font-size:25px;font-weight:600;white-space:nowrap}.compact-button{font-size:25px;background:transparent;line-height:1;padding:0 4px}.spacer{flex:1}.history-btn{font-size:28px;background:transparent;padding:0 4px}.display-area{flex:1;min-height:125px;display:flex;flex-direction:column;align-items:end;justify-content:end;padding:10px 22px 10px}.expression{font-size:18px;color:#adadad;min-height:25px;white-space:nowrap;overflow:hidden;max-width:100%}.display{font-size:clamp(35px,11vw,70px);font-weight:600;white-space:nowrap;letter-spacing:-2px;line-height:1.24;max-width:100%;overflow:hidden;text-overflow:clip;text-align:right}.memory-row{height:50px;flex-shrink:0;display:grid;grid-template-columns:repeat(6,1fr);margin:0 5px}.memory-row button{background:transparent;font-size:16px;font-weight:400}.memory-row button:disabled{color:#696969;cursor:default}.memory-row button:not(:disabled):hover{background:#313431}.keypad{height:59.5%;max-height:490px;flex-shrink:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(6,1fr);gap:3px;padding:2px 3px 8px}.keypad button{border-radius:5px;background:var(--panel);font-size:26px;min-height:0;font-weight:400}.keypad button.digit{background:var(--digit)}.keypad button.eq{background:var(--blue);color:#050505;font-size:29px}.keypad button:active{filter:brightness(1.25)}.drawer{position:absolute;z-index:2;right:0;top:45px;bottom:0;width:min(90%,365px);background:#252525;box-shadow:-8px 0 24px #0008;display:flex;flex-direction:column}.drawer[hidden],.shade[hidden]{display:none}.drawer .drawer-top{display:flex;justify-content:space-between;align-items:center;padding:18px 16px;font-size:22px;font-weight:600}.drawer button{background:#343434;padding:12px;margin:5px 10px;border-radius:5px;text-align:left;font-size:16px}.drawer .list{padding:4px 12px;overflow:auto;flex:1}.drawer .hist-row{padding:13px 7px;border-bottom:1px solid #444;cursor:pointer}.drawer .hist-expression{color:#bbb;font-size:15px;text-align:right;white-space:pre-line}.drawer .hist-result{text-align:right;font-size:25px;font-weight:600}.drawer .empty{text-align:center;color:#ccc;margin-top:80px}.drawer .drawer-actions{padding:10px}.shade{position:absolute;inset:45px 0 0;background:#0007;z-index:1}.toast{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);padding:9px 14px;background:#4a4a4a;border-radius:6px;pointer-events:none;display:none;white-space:nowrap;font-size:14px}
@media(max-height:680px){.window-bar{height:38px}.mode-bar{height:51px}.display-area{min-height:96px}.keypad{height:58%}.memory-row{height:40px}.keypad button{font-size:22px}}@media(max-width:360px){.window-controls button{width:34px}.mode-bar{gap:8px;padding:0 9px}.standard{font-size:21px}.keypad button{font-size:23px}}@media(min-width:537px){.calculator{border-radius:9px}}@media(max-width:536px){body{background:var(--bg)}.calculator{border:0;border-radius:0}}
</style></head>
<body><main class="calculator" role="application" aria-label="Beat Calculator">
<header class="window-bar"><span class="app-symbol">▦</span><span class="app-label">Calculator</span><div class="window-controls"><button title="ย่อหน้าจอ" id="minBtn">−</button><button title="เต็มจอ" id="fullBtn">□</button><button title="ปิดเมนู" id="closeBtn" class="close">×</button></div></header>
<section class="mode-bar"><button class="menu-button" aria-label="เมนู" id="menuBtn">☰</button><span class="standard">Standard</span><button class="compact-button" aria-label="คัดลอกผลลัพธ์" id="copyBtn">⧉</button><div class="spacer"></div><button class="history-btn" aria-label="ประวัติการคำนวณ" id="historyBtn">◴</button></section>
<section class="display-area"><div class="expression" id="expression"></div><div class="display" id="display" aria-live="polite">0</div></section>
<div class="memory-row"><button data-key="MC" id="mc" disabled>MC</button><button data-key="MR" id="mr" disabled>MR</button><button data-key="M+">M+</button><button data-key="M−">M−</button><button data-key="MS">MS</button><button id="memBtn" disabled>M⌄</button></div>
<div class="keypad" id="keys">
<button data-key="%">%</button><button data-key="CE">CE</button><button data-key="C">C</button><button data-key="⌫" aria-label="ลบทีละหลัก">⌫</button>
<button data-key="1/x">¹⁄ₓ</button><button data-key="x²">x²</button><button data-key="√x">²√x</button><button data-key="÷">÷</button>
<button class="digit" data-key="7">7</button><button class="digit" data-key="8">8</button><button class="digit" data-key="9">9</button><button data-key="×">×</button>
<button class="digit" data-key="4">4</button><button class="digit" data-key="5">5</button><button class="digit" data-key="6">6</button><button data-key="−">−</button>
<button class="digit" data-key="1">1</button><button class="digit" data-key="2">2</button><button class="digit" data-key="3">3</button><button data-key="+">+</button>
<button class="digit" data-key="±">⁺⁄₋</button><button class="digit" data-key="0">0</button><button class="digit" data-key=".">.</button><button class="eq" data-key="=">=</button>
</div>
<div class="shade" id="shade" hidden></div><div class="drawer" id="drawer" hidden><div class="drawer-top"><span id="drawerTitle">History</span><button id="drawerClose" style="background:transparent;margin:0">×</button></div><div class="list" id="drawerList"></div><div class="drawer-actions" id="drawerActions"></div></div><div class="toast" id="toast"></div>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let entry='0',acc=null,op=null,lastOp=null,lastArg=null,start=false,equals=false,error=false,expr='',mem=null;
const storeKey='BeatCalculatorStandardV2-New';let history=[];
try{const saved=JSON.parse(localStorage.getItem(storeKey)||'{}');if(typeof saved.mem==='number'&&Number.isFinite(saved.mem))mem=saved.mem;if(Array.isArray(saved.history))history=saved.history.slice(0,50)}catch{}
function fmt(n){if(!Number.isFinite(n))return 'Overflow';if(Math.abs(n)>1e15||Math.abs(n)<1e-7&&n!==0)return n.toExponential(7);return new Intl.NumberFormat('en-US',{useGrouping:true,maximumFractionDigits:12}).format(Number(n.toPrecision(13)))}
function parse(){return Number(entry)}function set(n){if(!Number.isFinite(n)){fail('Overflow');return false}entry=String(Number(n.toPrecision(13)));return true}
function fail(s){error=true;entry=s;op=null;acc=null;lastOp=null;lastArg=null;expr='';start=false;equals=false}
function clear(){entry='0';acc=null;op=null;lastOp=null;lastArg=null;start=false;equals=false;error=false;expr=''}
function resetAfter(){clear()}
function calc(a,b,o){switch(o){case '+':return a+b;case '−':return a-b;case '×':return a*b;case '÷':if(b===0){fail('Cannot divide by zero');return null}return a/b}return a}
function digit(d){if(error)clear();if(equals&&!op)resetAfter();if(start){entry=d;start=false}else if(entry.replace(/\D/g,'').length<16){if(entry==='0')entry=d;else if(entry==='-0')entry=d==='0'?'-0':'-'+d;else entry+=d}}
function key(k){if(/^[0-9]$/.test(k)){digit(k);return}if(k==='.') {if(error)clear();if(equals&&!op)resetAfter();if(start){entry='0.';start=false}else if(!entry.includes('.'))entry+='.';return}
if(['+','−','×','÷'].includes(k)){if(error)return;const v=parse();if(op&&!start&&acc!==null){const r=calc(acc,v,op);if(r===null)return;acc=r;set(r)}else if(!op||equals)acc=v;op=k;expr=fmt(acc)+' '+k;start=true;equals=false;lastOp=null;lastArg=null;return}
if(k==='='){if(error)return;if(op&&acc!==null){const a=acc,b=start?a:parse(),r=calc(a,b,op);if(r===null)return;const line=fmt(a)+' '+op+' '+fmt(b)+' =';history.unshift([line,fmt(r)]);history=history.slice(0,50);lastOp=op;lastArg=b;op=null;acc=null;expr=line;set(r);equals=true;start=false}else if(equals&&lastOp!==null){const a=parse(),r=calc(a,lastArg,lastOp);if(r===null)return;const line=fmt(a)+' '+lastOp+' '+fmt(lastArg)+' =';history.unshift([line,fmt(r)]);history=history.slice(0,50);expr=line;set(r)}return}
if(k==='C'||k==='AC'){clear();return}if(k==='CE'){if(error||equals){clear();return}entry='0';start=false;return}if(k==='⌫'){if(error)clear();else if(!equals&&!start)entry=entry.length<=1||entry.length===2&&entry[0]==='-'?'0':entry.slice(0,-1);return}if(k==='±'){if(error)return;if(start){entry='0';start=false}if(entry!=='0')entry=entry[0]==='-'?entry.slice(1):'-'+entry;equals=false;return}
if(k==='%'){if(error)return;const v=start?0:parse();set(acc!==null&&(op==='+'||op==='−')?acc*v/100:v/100);start=false;equals=false;return}
if(k==='1/x'||k==='x²'||k==='√x'){if(error)return;const v=parse();if((k==='1/x'&&v===0)||(k==='√x'&&v<0)){fail(k==='1/x'?'Cannot divide by zero':'Invalid input');return}const r=k==='1/x'?1/v:k==='x²'?v*v:Math.sqrt(v);if(set(r)){expr=(k==='1/x'?'1/(':k==='x²'?'sqr(':'√(')+fmt(v)+')';start=false;equals=false}return}
if(k==='MS')mem=parse();if(k==='MC')mem=null;if(k==='M+')mem=(mem??0)+parse();if(k==='M−')mem=(mem??0)-parse();if(k==='MR'&&mem!==null){if(error)clear();if(equals&&!op)resetAfter();set(mem);start=false}}
function save(){try{localStorage.setItem(storeKey,JSON.stringify({mem,history}))}catch{}}
function redraw(){const d=$('display');d.textContent=error?entry:entry.endsWith('.')?fmt(parse())+'.':entry==='-0'?'-0':fmt(parse());$('expression').textContent=expr;d.style.fontSize=d.textContent.length>15?'36px':d.textContent.length>10?'48px':'';$('mc').disabled=mem===null;$('mr').disabled=mem===null;$('memBtn').disabled=mem===null;save()}
function press(k){key(k);redraw()};document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>press(b.dataset.key)));
let toastTimer;function toast(msg){const e=$('toast');e.textContent=msg;e.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.style.display='none',1750)}
function closeDrawer(){$('drawer').hidden=true;$('shade').hidden=true}
function drawer(title){$('drawerTitle').textContent=title;$('drawer').hidden=false;$('shade').hidden=false;$('drawerList').innerHTML='';$('drawerActions').innerHTML=''}
function action(text,fn){const b=document.createElement('button');b.textContent=text;b.addEventListener('click',fn);$('drawerActions').appendChild(b)}
function showHistory(){drawer('History');if(!history.length){$('drawerList').innerHTML='<div class="empty">ยังไม่มีประวัติการคำนวณ</div>';return}history.forEach(([expression,result])=>{const row=document.createElement('div');row.className='hist-row';const x=document.createElement('div');x.className='hist-expression';x.textContent=expression;const r=document.createElement('div');r.className='hist-result';r.textContent=result;row.append(x,r);row.addEventListener('click',()=>{clear();entry=result.replaceAll(',','');redraw();closeDrawer()});$('drawerList').appendChild(row)});action('ล้างประวัติทั้งหมด',()=>{history=[];save();showHistory()})}
function showMemory(){drawer('Memory');$('drawerList').innerHTML='<div class="hist-row"><div class="hist-result">'+(mem===null?'ยังไม่มีค่า':fmt(mem))+'</div></div>';if(mem!==null){action('MR — เรียกค่า',()=>{press('MR');closeDrawer()});action('MC — ล้างค่า',()=>{press('MC');closeDrawer()})}}
$('historyBtn').addEventListener('click',showHistory);$('memBtn').addEventListener('click',showMemory);$('drawerClose').addEventListener('click',closeDrawer);$('shade').addEventListener('click',closeDrawer);
$('menuBtn').addEventListener('click',()=>{drawer('Calculator');const l=$('drawerList');l.innerHTML='<div style="padding:20px">Standard Calculator<br><small>ออฟไลน์ • Version 2.0</small></div>';action('ล้างข้อมูลทั้งหมด',()=>{if(confirm('ล้างค่าปัจจุบัน ประวัติ และหน่วยความจำทั้งหมด?')){clear();history=[];mem=null;redraw();closeDrawer()}});action('ปิดเมนู',closeDrawer)});
$('copyBtn').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('display').textContent);toast('คัดลอกผลลัพธ์แล้ว')}catch{toast('เลือกตัวเลขแล้วคัดลอกได้')}});
$('minBtn').addEventListener('click',()=>toast('ใช้ปุ่ม Home เพื่อย่อแอปบน Android'));
$('fullBtn').addEventListener('click',()=>{const c=document.querySelector('.calculator');if(c.requestFullscreen&&!document.fullscreenElement)c.requestFullscreen().catch(()=>{});else if(document.fullscreenElement)document.exitFullscreen()});
$('closeBtn').addEventListener('click',()=>{closeDrawer();toast('ปิดหน้าต่างหรือแท็บเพื่อออก')});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const s=e.key,keys={'*':'×','/':'÷','-':'−','Enter':'=','Backspace':'⌫','Escape':'C',',':'.'};const k=keys[s]||s;if(/^[0-9.]$/.test(k)||['+','−','×','÷','=','⌫','C'].includes(k)){e.preventDefault();press(k)}});
redraw();
window.__calculatorTest={press,display:()=>$('display').textContent,reset:()=>{clear();history=[];mem=null;redraw()},getHistory:()=>history};
})();
</script></body></html>
