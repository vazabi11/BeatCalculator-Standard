name: Build Calculator APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Unit test calculator engine
        shell: bash
        run: |
          mkdir -p tests/out
          javac -encoding UTF-8 -d tests/out \
            app/src/main/java/com/beatoflove/standardcalculator/CalculatorEngine.java \
            tests/CalculatorEngineTest.java
          java -cp tests/out com.beatoflove.standardcalculator.CalculatorEngineTest

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeatCalculator-Standard-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
